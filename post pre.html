<!DOCTYPE html>
<html>
    <head>
        <title>Increment Decrement</title>
    </head>
    <body>
        <script>
            let a = 10;
            console.log("Post Increment:", a++);
            console.log("After Increment:", a);

            console.log("Post Decrement:", a--);
            console.log("After Decrement:", a);
        </script>
    </body>
    
</html>

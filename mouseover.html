<!DOCTYPE html>
<html>
    <head>
        <title>Mian Method</title>

    </head>
    <body>
        <img src="img/bulb.jpg" alt="" id="bulb">


        <script>
            var a = document.getElementById("bulb");
            a.addEventListener("mouseover",()=>{
                a,src="img/bulb2.jpg";
            });
            a.addEventListener("mouseout",()=>{
                a.src= "img/bulb1.jpg";
            });
            </script>
            </body>
            </html>

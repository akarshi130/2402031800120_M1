<!DOCTYPE html>
<html>
<head>
    <title>Simple jQuery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <p id="text">Hello World!</p>
    <button id="btn">Change Text</button>

    <script>
    
        $("#btn").click(function() {
            $("#text").text("jQuery is working!");
        });
    </script>

</body>
</html>  -+

<!DOCTYPE html>

<body>
    <script>
      function sum()
{
    var s = 0;
    for(var i = 0; i < arguments.length; i++)
    {
        s += arguments[i];
    }
    return s;
}
document.write(sum(1, 2, 3));
document.write("<br>");

document.write(sum(1, 2, 3, 4, 5));
document.write("<br>");

document.write(sum(1, 2, "3", 4, 5));

</script>

</body>
